# argocd/floci-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: floci
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/oss-slu/k8s-manifests
    targetRevision: HEAD
    path: apps/floci
  destination:
    server: https://kubernetes.default.svc
    namespace: floci
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
